  <!-- CrazyGames: their SDK from the very start, so loadingStart() comes before any of the game
       loads (crazygames.ts picks this up); anywhere else this does nothing -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (!/(^|\.)crazygames\.[a-z.]+$/i.test(location.hostname) && q.get('useLocalSdk') !== 'true') return;
      var s = document.createElement('script');
      s.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
      window.__crazyBoot = new Promise(function (done) {
        s.onerror = function () { done(null); };
        s.onload = function () {
          var sdk = window.CrazyGames && window.CrazyGames.SDK;
          if (!sdk) return done(null);
          sdk.init().then(function () {
            if (sdk.environment !== 'crazygames' && sdk.environment !== 'local') return done(null);
            try { sdk.game.loadingStart(); } catch (e) { console.warn('[crazygames] loadingStart', e); }
            done(sdk);
          }, function () { done(null); });
        };
      });
      document.head.appendChild(s);
    })();
  </script>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <!-- webmanifest: the site build only (VITE_WEBMANIFEST=1, vite.config.ts drops this block) -->
