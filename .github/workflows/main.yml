name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/main.yml'

# The client is served by GitHub Pages (openbomber.ru); the game runs on ru.openbomber.ru (the
# server in Russia, nginx → pm2) for the site, and on Fly.io in Amsterdam (openbomber-eu) for the
# Discord activity, next to Discord's proxy.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Test, build, deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      # The site connects to the server in Russia; inside Discord the client ignores
      # VITE_SERVER_URL and goes through Discord's proxy to <host>/socket.io (→ Fly.io).
      - name: Build client
        run: bun run --filter '@ob/client' build
        env:
          VITE_SERVER_URL: wss://ru.openbomber.ru/socket.io
          VITE_SERVER_PATH: /socket.io
          # Discord activity (packages/client/src/discord.ts); empty = the activity login is off
          VITE_DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}

      - name: Build server
        run: |
          cd packages/server
          bun run build
          cd dist
          npm install --omit=dev --no-audit --no-fund

      # v2 goes to its own folder; /root/openbomber (v1) stays untouched for a rollback.
      - name: Upload server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "packages/server/dist/*"
          target: "/root/openbomber-v2"
          strip_components: 3
          rm: true

      # Smoke-start under pm2 on a spare port first (checks Node + pm2 ESM support); the live
      # process is only switched when that answers, and v1 is restored if v2 then fails.
      - name: Switch server
        uses: appleboy/ssh-action@v1.1.0
        env:
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        with:
          envs: DISCORD_CLIENT_ID,DISCORD_CLIENT_SECRET
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /root/openbomber-v2
            NODE_MAJOR=$(node -p 'process.versions.node.split(".")[0]')
            echo "node $(node -v), pm2 $(pm2 -v)"
            if [ "$NODE_MAJOR" -lt 20 ]; then echo "Node >= 20 required"; exit 1; fi
            health() { node -e "fetch('http://127.0.0.1:$1/socket.io/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; }
            pm2 delete openbomber-smoke --silent || true
            PORT=3101 HOST=127.0.0.1 BASE_PATH=/socket.io pm2 start index.js --name openbomber-smoke --update-env
            sleep 5
            if ! health 3101; then pm2 logs openbomber-smoke --lines 40 --nostream || true; pm2 delete openbomber-smoke || true; exit 1; fi
            pm2 delete openbomber-smoke
            pm2 delete openbomber --silent || true
            PORT=3001 HOST=127.0.0.1 BASE_PATH=/socket.io pm2 start index.js --name openbomber --update-env
            sleep 4
            if ! health 3001; then
              echo "v2 failed on :3001, restoring v1"
              pm2 logs openbomber --lines 40 --nostream || true
              pm2 delete openbomber || true
              cd /root/openbomber && pm2 start --name openbomber index.js
              exit 1
            fi
            pm2 save || true

      - name: Upload client for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  pages:
    name: Deploy client (GitHub Pages)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  fly:
    name: Deploy Discord server (Fly.io)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Secrets and deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          flyctl secrets set --stage DISCORD_CLIENT_ID="$DISCORD_CLIENT_ID" DISCORD_CLIENT_SECRET="$DISCORD_CLIENT_SECRET"
          flyctl deploy --remote-only --ha=false
