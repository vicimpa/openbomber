name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/main.yml'

# The client is served by GitHub Pages (openbomber.ru); the game server runs on Fly.io in
# Amsterdam (openbomber-eu) for the site and for the Discord activity (next to Discord's proxy).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Test, build, deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      # The site connects to Fly.io directly; inside Discord the client ignores VITE_SERVER_URL
      # and goes through Discord's proxy to <host>/api, mapped in the Developer Portal to the same
      # server (a mapping prefix can't contain a dot, so not /socket.io; the server takes both).
      - name: Build client
        run: bun run --filter '@ob/client' build
        env:
          VITE_SERVER_URL: wss://openbomber-eu.fly.dev/socket.io
          VITE_SERVER_PATH: /api
          # Discord activity (packages/client/src/discord.ts); empty = the activity login is off
          VITE_DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          # site-only files (packages/client/vite.config.ts): the web manifest with its icons and
          # the v1 service worker kill switch, the privacy policy / terms pages (the Discord
          # Developer Portal links to them) and the CNAME
          VITE_WEBMANIFEST: '1'
          VITE_POLICIES: '1'
          VITE_CNAME: openbomber.ru

      - name: Upload client for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  pages:
    name: Deploy client (GitHub Pages)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  fly:
    name: Deploy Discord server (Fly.io)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Secrets and deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          flyctl secrets set --stage DISCORD_CLIENT_ID="$DISCORD_CLIENT_ID" DISCORD_CLIENT_SECRET="$DISCORD_CLIENT_SECRET"
          flyctl deploy --remote-only --ha=false
