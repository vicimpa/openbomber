# The game server, on Fly.io in Amsterdam: for the site (the client is on GitHub Pages) and for the
# Discord activity, whose proxy runs on Cloudflare's edge right next to it. With nobody connected
# the machine is suspended (its memory snapshotted: the shared arena survives) and resumes on the
# next connection in a fraction of a second; billing is per second it runs.
# Deploy: fly deploy   (secrets: fly secrets set DISCORD_CLIENT_ID=... DISCORD_CLIENT_SECRET=...)
app = "openbomber-eu"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  BASE_PATH = "/socket.io"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/socket.io/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
